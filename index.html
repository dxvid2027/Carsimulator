<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!--
      Das App-Symbol.

      `icon.svg` ist die Vorlage (siehe public/icon.svg), die PNGs entstehen
      daraus mit `npm run icons`.

      iOS braucht zwingend das PNG unter `apple-touch-icon`: Beim "Zum
      Home-Bildschirm hinzufuegen" ignoriert es SVG-Symbole und zeigt sonst
      einen Ausschnitt der Seite als Kachel.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Vom Home-Bildschirm gestartet laeuft das Spiel ohne Browserleiste –
      also im Vollbild, so wie eine echte App.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Carsimulator" />

    <title>Carsimulator</title>
    <meta name="theme-color" content="#0b0e13" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
